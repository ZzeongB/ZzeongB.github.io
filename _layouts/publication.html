<!DOCTYPE html>
<html>
  {% include head.html %}

  <body>
    {% include header.html %}

    <div class="page-content">
      <div class="wrapper">
        <div class="publications">
          <h1 class="page-heading">{{ page.title }}</h1>
          {{ content }}

          {% for item in page.items %}
          <div class="publication-item">
            <span class="publication-text">
              <strong class="publication-title">{{ item.title }}</strong>
              <br>
              <em class="publication-authors">{{ item.authors }}</em>
              <br>
              <span class="publication-status">{{ item.status }}</span>
              <br>
              {{ item.description }}
            </span>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>

    {% include footer.html %}

    {% include foot.html %}
  </body>
</html>
